[pytest]
filterwarnings =
    ignore::pytest.PytestReturnNotNoneWarning
    # Pydantic deprecations come from third-party libs; suppress noisy messages
    ignore:.*__fields__.*:DeprecationWarning
    # Ignore unclosed aiohttp session ResourceWarnings during tests (best-effort cleanup exists)
    ignore:unclosed client session:ResourceWarning
    ignore::DeprecationWarning:urllib3
    ignore::DeprecationWarning:yarl

asyncio_mode = auto
python_files = test_*.py
testpaths = tests

